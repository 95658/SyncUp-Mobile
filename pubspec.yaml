name: syncup
description: "SyncUp - Private B2B SaaS Platform Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_infinite_scroll: ^1.0.1

  # Routing
  auto_route: ^7.8.4

  # Networking
  dio: ^5.4.3+1

  # i18n
  slang: ^3.30.2
  slang_flutter: ^3.30.2

  # Storage & Utilities
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2

  # UI & Design System
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Firebase & Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  auto_route_generator: ^7.3.2
  slang_build_runner: ^3.30.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/syncup_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#080A0F"
  adaptive_icon_foreground: "assets/icons/syncup_icon.png"
  web:
    generate: true
    image_path: "assets/icons/syncup_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/syncup_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lang/

